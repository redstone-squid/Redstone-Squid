default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    # locales/ is excluded because pybabel always emits a trailing blank line, so fixing it here
    # only makes the next `just i18n-update` put it back.
    { id = "end-of-file-fixer", exclude = "^(alembic/sql/|locales/|schema/|schema_dump\\.sql$|supabase/|tests/fuzz/corpus/|tests/supabase/)" },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = "^(alembic/sql/|schema/|schema_dump\\.sql$|supabase/|tests/fuzz/corpus/|tests/supabase/)" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run --locked ruff check --fix --force-exclude", language = "system", types = ["python"], stages = ["pre-commit"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run --locked ruff format --force-exclude", language = "system", types = ["python"], stages = ["pre-commit"] },
    { id = "pyrefly", name = "pyrefly", entry = "uv run --locked pyrefly check --config pyproject.toml --baseline pyrefly-baseline.json", language = "system", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
