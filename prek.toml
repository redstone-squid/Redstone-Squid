default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    # Compose validates its own merge tags in the deployment tests.
    { id = "check-yaml", exclude = "^deploy/compose\\.(edge|production)\\.yml$" },
    { id = "end-of-file-fixer", exclude = "^(squid/core/persistence/migrations/sql/|schema/structure/|schema/schema_dump\\.sql$|tests/fuzz/corpus/)" },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = "^(squid/core/persistence/migrations/sql/|schema/structure/|schema/schema_dump\\.sql$|tests/fuzz/corpus/)" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run --locked ruff check --fix --force-exclude", language = "system", types = ["python"], stages = ["pre-commit"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run --locked ruff format --force-exclude", language = "system", types = ["python"], stages = ["pre-commit"] },
    { id = "web-format", name = "web Prettier", entry = '''bash -c 'cd web && exec bun run prettier --write -- "${@#web/}"' --''', language = "system", files = '^web/.*\.(astro|css|js|jsonc?|md|svelte|ts)$', exclude = '^web/(src/generated/|openapi\.json$)', stages = ["pre-commit"] },
    { id = "web-lint", name = "web lint", entry = "bun run --cwd web lint", language = "system", pass_filenames = false, files = '^web/', stages = ["pre-push"] },
    { id = "i18n-check", name = "validate Fluent catalogs", entry = "uv run --locked squid-i18n check", language = "system", pass_filenames = false, files = '^(squid/.*\.py$|packages/.*\.py$|squid/locales/|packages/[^/]+/src/[^/]+/locales/|(?:packages/[^/]+/)?pyproject\.toml$|uv\.lock$|prek\.toml$)', stages = ["pre-push"] },
    { id = "pyrefly", name = "pyrefly", entry = "uv run --locked pyrefly check --config pyproject.toml", language = "system", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
