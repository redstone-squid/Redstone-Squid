name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches: ["*"]
  workflow_dispatch:

env:
  UV_VERSION: "0.11.32"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --dev

      - name: Check all files have corresponding gitattributes
        shell: bash
        run: |
          missing_attributes=$(git ls-files | git check-attr -a --stdin | grep 'text: auto' || printf '\n')
          if [ -n "$missing_attributes" ]; then
            printf '%s\n%s\n' '.gitattributes rule missing for the following files:' "$missing_attributes"
            exit 1
          fi
          printf '%s\n' 'All files have a corresponding rule in .gitattributes'

      - name: Check linting
        run: uv run ruff check --extend-select I

      - name: Check formatting
        run: uv run ruff format --target-version py312 --check

      - name: Check types
        run: uv run basedpyright --level=warning

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  unit:
    name: Unit and architecture (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --dev

      - name: Run unit and architecture tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest tests/unit tests/architecture --cov=squid --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-${{ matrix.python-version }}-${{ github.event_name }}
          path: htmlcov/

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --dev

      - name: Run integration tests
        run: uv run pytest tests/integration --no-cov

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
