name: Continuous Integration

permissions: {}

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  UV_VERSION: "0.11.32"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      python: ${{ steps.filter.outputs.python }}
      cli: ${{ steps.filter.outputs.cli }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'squid/**'
              - 'tests/**'
              - 'scripts/**'
              - 'contracts/**'
              - 'alembic/**'
              - 'schema/**'
              - 'minecraft/**'
              - 'locales/**'
              - 'reference/**'
              - 'requirements/**'
              - 'supabase/**'
              - 'deploy/**'
              - 'app.py'
              - 'babel.cfg'
              - 'alembic.ini'
              - 'prek.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.gitattributes'
              - 'Dockerfile'
              - 'Dockerfile.api-fuzz'
              - 'compose.yml'
              - '.github/workflows/ci.yml'
            cli:
              - 'cli/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  actions-security:
    name: Actions security
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload zizmor's SARIF results to GitHub code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1

  quality:
    name: Quality
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --dev

      - name: Check committed API contracts
        run: |
          uv run --locked python -m scripts.export_openapi
          uv run --locked python -m scripts.export_fuzz_schemas
          git diff --exit-code -- contracts/openapi.json contracts/fuzz

      - name: Check all files have corresponding gitattributes
        shell: bash
        run: |
          missing_attributes=$(git ls-files | git check-attr -a --stdin | grep 'text: auto' || printf '\n')
          if [ -n "$missing_attributes" ]; then
            printf '%s\n%s\n' '.gitattributes rule missing for the following files:' "$missing_attributes"
            exit 1
          fi
          printf '%s\n' 'All files have a corresponding rule in .gitattributes'

      - name: Check linting
        run: uv run --locked ruff check --extend-select I

      - name: Check formatting
        run: uv run --locked ruff format --target-version py312 --check

      - name: Check repository files
        run: uv run --locked prek run --all-files

      - name: Check types with BasedPyright
        run: uvx --from basedpyright==1.39.9 basedpyright --level=warning

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  dependency-security:
    name: Dependency security
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Audit locked production dependencies
        run: |
          audit_requirements=$(mktemp)
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file "$audit_requirements" >/dev/null
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement "$audit_requirements" \
            --no-deps \
            --disable-pip \
            --progress-spinner=off

      - name: Export dependency SBOM
        run: uv export --locked --no-dev --format cyclonedx1.5 --output-file dependency-report.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom-${{ github.sha }}
          path: dependency-report.json

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  cli-quality:
    name: CLI quality (Rust 1.85)
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Check CLI formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Lint the CLI workspace
        run: cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test the CLI workspace
        run: cargo +1.85.0 test --locked --workspace --no-fail-fast

      - name: Build and smoke test the CLI
        run: |
          cargo +1.85.0 build --locked --release --package squid-cli
          ./target/release/squid --output json version

  web-quality:
    name: Catalogue quality
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.13"

      - name: Install catalogue dependencies
        run: bun install --frozen-lockfile

      - name: Check generated SDK
        run: bun run sdk:check

      - name: Check catalogue formatting
        run: bun run format:check

      - name: Lint catalogue
        run: bun run lint

      - name: Check Astro and TypeScript
        run: bun run check

      - name: Run catalogue unit tests
        run: bun run test

      - name: Build catalogue
        run: bun run build

      - name: Check client JavaScript budget
        run: bun run check:bundle

      - name: Audit catalogue dependencies
        run: bun audit

      - name: Install Lighthouse browser
        run: |
          bunx playwright install --with-deps chromium
          echo "CHROME_PATH=$(bun -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Run Lighthouse budgets
        run: bun run test:lighthouse

      - name: Upload catalogue reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-quality-${{ github.sha }}
          path: |
            web/coverage/
            web/.lighthouseci/reports/
          if-no-files-found: ignore

  web-e2e-pr:
    name: Catalogue PR browser (${{ matrix.project }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: mobile-safari
            browser: webkit
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run build
      - run: bunx playwright test --project=${{ matrix.project }} --workers=1 --shard=1/1
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-pr-${{ matrix.project }}-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/

  web-e2e-full:
    name: Catalogue full browser (${{ matrix.project }})
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run build
      - run: bunx playwright test --project=${{ matrix.project }} --workers=1 --shard=1/1
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-full-${{ matrix.project }}-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/

  deploy:
    name: Deploy
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [actions-security, cli-quality, dependency-security, quality, unit, integration, web-quality, web-e2e-full]
    permissions: {}
    uses: ./.github/workflows/cd.yml
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_USER: ${{ secrets.SSH_USER }}

  unit:
    name: Unit and architecture (Python ${{ matrix.python-version }})
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --dev

      - name: Compile translation catalogs
        run: uv run --locked pybabel compile -d locales -D squid

      - name: Run unit and architecture tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run --locked pytest tests/unit tests/architecture --cov=squid --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-${{ matrix.python-version }}-${{ github.event_name }}
          path: htmlcov/

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  integration:
    name: PostgreSQL integration
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run integration tests
        run: uv run --locked pytest tests/integration --no-cov

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
