name: Commit catalogue screenshots

on:
  workflow_run:
    workflows: ["Catalogue screenshots"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  commit:
    name: Validate and commit screenshot artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # For workflow_run, github.sha is the trusted default-branch revision that authorized this job.
      - name: Load trusted screenshot validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .trusted-workflow
          sparse-checkout: .github/scripts/catalogue-screenshot-plan.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download screenshot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalogue-screenshots-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/catalogue-screenshots
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and commit without executing pull request code
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SCREENSHOT_DIRECTORY: ${{ runner.temp }}/catalogue-screenshots
          TRUSTED_SCREENSHOT_PLANNER: ${{ github.workspace }}/.trusted-workflow/.github/scripts/catalogue-screenshot-plan.cjs
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {planScreenshotArtifact} = require(process.env.TRUSTED_SCREENSHOT_PLANNER);

            const directory = process.env.SCREENSHOT_DIRECTORY;
            const artifactPlan = planScreenshotArtifact(fs.readdirSync(directory).map((filename) => {
              const filePath = path.join(directory, filename);
              const stats = fs.lstatSync(filePath);
              return {
                name: filename,
                isFile: stats.isFile(),
                isSymbolicLink: stats.isSymbolicLink(),
                contents: stats.isFile() && !stats.isSymbolicLink() ? fs.readFileSync(filePath) : Buffer.alloc(0),
              };
            }));

            const run = context.payload.workflow_run;
            const runPull = run.pull_requests[0];
            if (run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('The triggering workflow did not originate in this repository.');
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: runPull.number,
            });
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Fork pull requests cannot receive a write token.');
            }
            if (pull.head.sha !== runPull.head.sha) {
              throw new Error('The pull request head changed after screenshots were captured; regenerate them.');
            }

            const blobs = [];
            for (const plannedBlob of artifactPlan.blobs) {
              const { data: blob } = await github.rest.git.createBlob({
                ...context.repo,
                content: plannedBlob.content,
                encoding: plannedBlob.encoding,
              });
              blobs.push({
                path: plannedBlob.path,
                mode: plannedBlob.mode,
                type: plannedBlob.type,
                sha: blob.sha,
              });
            }

            const { data: parent } = await github.rest.git.getCommit({
              ...context.repo,
              commit_sha: pull.head.sha,
            });
            const { data: tree } = await github.rest.git.createTree({
              ...context.repo,
              base_tree: parent.tree.sha,
              tree: blobs,
            });
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: 'docs: regenerate website screenshots',
              tree: tree.sha,
              parents: [pull.head.sha],
            });
            await github.rest.git.updateRef({
              ...context.repo,
              ref: `heads/${pull.head.ref}`,
              sha: commit.sha,
              force: false,
            });
