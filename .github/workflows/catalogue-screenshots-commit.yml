name: Commit catalogue screenshots

on:
  workflow_run:
    workflows: ["Catalogue screenshots"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  commit:
    name: Validate and commit screenshot artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download screenshot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalogue-screenshots-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/catalogue-screenshots
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and commit without executing pull request code
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SCREENSHOT_DIRECTORY: ${{ runner.temp }}/catalogue-screenshots
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const expected = [
              'en-desktop-build-detail.png',
              'en-desktop-builds.png',
              'en-desktop-home.png',
              'en-desktop-record-detail.png',
              'zh-cn-mobile-build-detail.png',
              'zh-cn-mobile-builds.png',
              'zh-cn-mobile-home.png',
              'zh-cn-mobile-record-detail.png',
            ];
            const signature = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
            const directory = process.env.SCREENSHOT_DIRECTORY;
            const files = fs.readdirSync(directory).sort();
            if (JSON.stringify(files) !== JSON.stringify(expected)) {
              throw new Error(`Screenshot artifact path allowlist mismatch: ${files.join(', ')}`);
            }

            let totalBytes = 0;
            for (const filename of files) {
              const filePath = path.join(directory, filename);
              const stats = fs.lstatSync(filePath);
              if (!stats.isFile() || stats.isSymbolicLink()) {
                throw new Error(`${filename} is not a regular file.`);
              }
              const contents = fs.readFileSync(filePath);
              if (!contents.subarray(0, signature.length).equals(signature)) {
                throw new Error(`${filename} does not have a PNG signature.`);
              }
              totalBytes += contents.byteLength;
            }
            if (totalBytes > 8 * 1024 * 1024) {
              throw new Error(`Screenshot artifact is ${(totalBytes / 1024 / 1024).toFixed(1)} MiB; maximum is 8 MiB.`);
            }

            const run = context.payload.workflow_run;
            const runPull = run.pull_requests[0];
            if (run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('The triggering workflow did not originate in this repository.');
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: runPull.number,
            });
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Fork pull requests cannot receive a write token.');
            }
            if (pull.head.sha !== runPull.head.sha) {
              throw new Error('The pull request head changed after screenshots were captured; regenerate them.');
            }

            const blobs = [];
            for (const filename of files) {
              const content = fs.readFileSync(path.join(directory, filename)).toString('base64');
              const { data: blob } = await github.rest.git.createBlob({
                ...context.repo,
                content,
                encoding: 'base64',
              });
              blobs.push({
                path: `catalogue-screenshots/${filename}`,
                mode: '100644',
                type: 'blob',
                sha: blob.sha,
              });
            }

            const { data: parent } = await github.rest.git.getCommit({
              ...context.repo,
              commit_sha: pull.head.sha,
            });
            const { data: tree } = await github.rest.git.createTree({
              ...context.repo,
              base_tree: parent.tree.sha,
              tree: blobs,
            });
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: 'docs: regenerate website screenshots',
              tree: tree.sha,
              parents: [pull.head.sha],
            });
            await github.rest.git.updateRef({
              ...context.repo,
              ref: `heads/${pull.head.ref}`,
              sha: commit.sha,
              force: false,
            });
