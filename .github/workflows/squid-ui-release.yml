name: Publish Squid UI

on:
  push:
    tags:
      - squid-ui-v*

permissions: {}

concurrency:
  group: squid-ui-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"

jobs:
  build:
    name: Build release set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: false

      - name: Verify release tag and lockfile
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python scripts/check_squid_ui_release.py "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          uv lock --locked

      - name: Install test dependencies
        run: uv sync --locked --dev

      - name: Test framework packages and boundaries
        run: uv run --locked pytest --no-cov packages tests/architecture

      - name: Build and inspect distributions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python scripts/build_squid_ui_dist.py dist
          python scripts/check_squid_ui_dist.py dist "$RELEASE_VERSION"

      - name: Upload release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squid-ui-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # Record provenance for every wheel and source distribution.
      contents: read
      id-token: write # Authenticate both the attestation and PyPI trusted publishing.
    environment:
      name: pypi
      url: https://pypi.org/project/squid-ui/${{ needs.build.outputs.version }}/

    steps:
      - name: Download verified release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: squid-ui-dist
          path: dist

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
