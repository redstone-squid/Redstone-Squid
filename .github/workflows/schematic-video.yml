name: Schematic video
on:
  pull_request:
    paths:
      - 'native/schematic-video/**'
      - 'squid/schematics/**'
      - 'tests/integration/schematics/test_video_worker.py'
      - '.github/workflows/schematic-video.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.15'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libvulkan1 mesa-vulkan-drivers
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - run: cargo +1.100.0 fmt --manifest-path native/schematic-video/Cargo.toml --check
      - run: cargo +1.100.0 test --locked --manifest-path native/schematic-video/Cargo.toml
      - run: cargo +1.100.0 build --locked --manifest-path native/schematic-video/Cargo.toml
      - run: uv sync --locked --dev --extra schematics
      - run: uv run --locked pytest --no-cov tests/integration/schematics/test_video_worker.py
