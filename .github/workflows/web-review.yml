name: Website visual review

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-review.yml"
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-review.yml"
  workflow_dispatch:

# Screenshots are not committed. Each master run publishes them as the baseline artifact,
# and pull requests compare against the latest one. A difference is listed in the job
# summary and the gallery; it never fails the job, because changes are reviewed, not approved.
permissions:
  contents: read
  actions: read

concurrency:
  group: web-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - name: Download master's screenshot baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow web-review.yml --branch master \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$REPO" --name web-review-baseline \
              --dir tests/review/__screenshots__
          else
            echo "No master baseline yet; every screenshot is reported as new."
          fi
      - name: Run review checks and compare screenshots
        env:
          REVIEW_COMPARE: "1"
        run: >-
          bun run test:review
          ${{ github.event_name == 'push' && '--update-snapshots=all' || '' }}
      - run: bun run test:compatibility
      - name: Upload screenshots, recordings, and diagnostic report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-review-${{ github.sha }}
          path: |
            web/review-gallery/
            web/playwright-report/review/
            web/playwright-report/compatibility/
            web/test-results/review/
            web/test-results/compatibility/
          if-no-files-found: error
          retention-days: 14
      - name: Publish the screenshot baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-review-baseline
          path: web/tests/review/__screenshots__/
          if-no-files-found: error
          retention-days: 90
      - name: Explain review artifacts
        if: ${{ !cancelled() }}
        run: |
          echo '### Review artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the website-review artifact and open review-gallery/index.html for screenshots and workflow videos; screenshots that differ from master come first. The Playwright report has failure traces.' >> "$GITHUB_STEP_SUMMARY"
