name: Website visual review

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:review
      - name: Upload screenshots, recordings, and diagnostic report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-review-${{ github.sha }}
          path: |
            web/review-gallery/
            web/playwright-report/review/
            web/test-results/review/
          if-no-files-found: error
          retention-days: 14
      - name: Explain review artifacts
        if: ${{ !cancelled() }}
        run: |
          echo '## Website visual review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the website-review artifact and open review-gallery/index.html for screenshots and successful workflow videos. The Playwright report includes visual differences and failure traces. Baseline updates require review.' >> "$GITHUB_STEP_SUMMARY"
