name: Catalogue screenshots

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture catalogue screenshots
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'catalogue-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Build catalogue
        working-directory: web
        run: bun run build

      - name: Capture screenshots
        working-directory: web
        run: bun run test:docs-screenshots

      - name: Upload screenshot set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-screenshots-${{ github.event.pull_request.number || github.run_id }}
          path: catalogue-screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Explain fork update process
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::Download the catalogue-screenshots artifact, replace the eight PNGs in catalogue-screenshots/, and push them from the fork.'
          exit 1
