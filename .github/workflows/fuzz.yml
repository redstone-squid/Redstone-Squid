name: Scheduled Fuzzing

permissions: {}

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  UV_VERSION: "0.13.7"

concurrency:
  group: fuzzing
  cancel-in-progress: false

jobs:
  properties:
    name: Parser and draft properties
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check parser properties
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run --locked pytest tests/fuzz/test_parsers.py --no-cov

      - name: Check draft edits against PostgreSQL
        run: uv run --locked pytest tests/integration/api/test_draft_properties.py --no-cov
