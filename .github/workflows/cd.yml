name: Continuous Deployment

permissions: {}

on:
  workflow_call:
    secrets:
      SSH_HOST:
        required: true
      SSH_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true
      SSH_USER:
        required: true
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build and smoke test release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # Publish release images and their BuildKit attestations.
    outputs:
      app-image: ${{ steps.references.outputs.app_image }}
      worker-image: ${{ steps.references.outputs.worker_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to the container registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" --username "$GHCR_USER" --password-stdin

      - name: Create the BuildKit builder
        run: docker buildx create --driver docker-container --use

      - name: Build and publish application image
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          image="$REGISTRY/${IMAGE_REPOSITORY,,}/app:${GITHUB_SHA}"
          commit_message=$(git log -1 --pretty=%s)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GIT_COMMIT_HASH=$GITHUB_SHA" \
            --build-arg "GIT_COMMIT_MESSAGE=$commit_message" \
            --build-arg WITH_OBSERVABILITY=1 \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image" \
            --push \
            .

      - name: Build and publish native worker image
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          image="$REGISTRY/${IMAGE_REPOSITORY,,}/worker:${GITHUB_SHA}"
          commit_message=$(git log -1 --pretty=%s)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GIT_COMMIT_HASH=$GITHUB_SHA" \
            --build-arg "GIT_COMMIT_MESSAGE=$commit_message" \
            --build-arg WITH_OBSERVABILITY=1 \
            --build-arg WITH_SCHEMATICS=1 \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image" \
            --push \
            .

      - name: Resolve immutable image digests
        id: references
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          app_tag="$REGISTRY/${IMAGE_REPOSITORY,,}/app:${GITHUB_SHA}"
          worker_tag="$REGISTRY/${IMAGE_REPOSITORY,,}/worker:${GITHUB_SHA}"
          app_digest="sha256:$(docker buildx imagetools inspect "$app_tag" --raw | sha256sum | cut -d' ' -f1)"
          worker_digest="sha256:$(docker buildx imagetools inspect "$worker_tag" --raw | sha256sum | cut -d' ' -f1)"
          printf 'app_image=%s@%s\n' "${app_tag%:*}" "$app_digest" >> "$GITHUB_OUTPUT"
          printf 'worker_image=%s@%s\n' "${worker_tag%:*}" "$worker_digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test the published images
        env:
          APP_IMAGE: ${{ steps.references.outputs.app_image }}
          WORKER_IMAGE: ${{ steps.references.outputs.worker_image }}
        run: bash scripts/release-smoke.sh "$APP_IMAGE" "$WORKER_IMAGE"

  deploy:
    name: Production cutover
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read # Authorize the production host to pull this workflow's private images.
    env:
      APP_IMAGE: ${{ needs.release.outputs.app-image }}
      WORKER_IMAGE: ${{ needs.release.outputs.worker-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure pinned production SSH host
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Install deployment control files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          tar -czf - compose.yml deploy/compose.production.yml deploy/otel-collector.yaml scripts/deploy.sh \
            | ssh "$SSH_USER@$SSH_HOST" 'mkdir -p Redstone-Squid && tar -xzf - -C Redstone-Squid'

      - name: Deploy immutable release
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | ssh "$SSH_USER@$SSH_HOST" \
                "docker login '$REGISTRY' --username '$GHCR_USER' --password-stdin >/dev/null && \
                 cd Redstone-Squid && bash scripts/deploy.sh '$APP_IMAGE' '$WORKER_IMAGE'; \
                 status=\$?; docker logout '$REGISTRY' >/dev/null; exit \$status"
