name: Schema Artifacts

permissions: {}

on:
  push:
    branches: [master]
    paths:
      - "alembic/**"
      - "squid/persistence/**"
      - ".github/workflows/schema-artifacts.yml"
      - "scripts/export_schema.sh"
      - "uv.lock"
      - "pyproject.toml"
  pull_request:
    paths:
      - "alembic/**"
      - "squid/persistence/**"
      - ".github/workflows/schema-artifacts.yml"
      - "scripts/export_schema.sh"
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: schema-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  generate:
    name: Generate schema views from a disposable database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Commit the generated schema files after trusted pushes to master.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --dev

      - name: Generate schema/schema_dump.sql and schema/structure
        run: scripts/export_schema.sh

      - name: Commit refreshed schema files
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- schema/schema_dump.sql schema/structure)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema/schema_dump.sql schema/structure
          git commit -m "chore(schema): refresh generated schema files [skip ci]"
          gh auth setup-git
          git push

      - name: Require up-to-date schema files
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- schema/schema_dump.sql schema/structure)" ]; then
            exit 0
          fi

          echo "schema/schema_dump.sql or schema/structure does not match the migrations. Run 'just schema-docs' and commit the result."
          git status --short -- schema/schema_dump.sql schema/structure
          git diff --stat -- schema/schema_dump.sql schema/structure
          exit 1
