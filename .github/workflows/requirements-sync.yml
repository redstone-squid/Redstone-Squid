name: Requirements Sync

permissions:
  contents: read

on:
  push:
    paths:
      - pyproject.toml
      - uv.lock
      - requirements/**
      - .github/workflows/requirements-sync.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - requirements/**
      - .github/workflows/requirements-sync.yml
  workflow_dispatch:

concurrency:
  group: requirements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Export requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Commit regenerated exports after pushes.

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv and Python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.11.32"
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Regenerate exported requirements
      run: |
        uv export --locked --no-dev -o requirements/base.txt --quiet
        uv export --locked --only-dev -o requirements/dev.txt --quiet

    - name: Assert production requirements exclude development packages
      run: |
        if grep -Eq '^(nucleation|pyrefly|pytest|ruff|schemathesis|testcontainers)==' requirements/base.txt; then
          echo "requirements/base.txt contains development-only packages"
          exit 1
        fi

    - name: Detect regenerated changes
      id: diff
      shell: bash
      run: |
        if git diff --quiet -- requirements/base.txt requirements/dev.txt; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit regenerated requirements
      if: github.event_name == 'push' && steps.diff.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add requirements/base.txt requirements/dev.txt
        git commit -m "Sync exported requirements"
        gh auth setup-git
        git push || {
          echo "Unable to push regenerated requirements. Commit the updated files manually."
          exit 1
        }

    - name: Fail when regenerated files differ
      if: github.event_name != 'push' && steps.diff.outputs.changed == 'true'
      shell: bash
      run: |
        echo "requirements/*.txt do not match the current uv export output."
        echo "Push the branch again or commit the regenerated files manually if the sync workflow cannot write to it."
        git diff -- requirements/base.txt requirements/dev.txt
        exit 1
