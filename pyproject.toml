[project]
name = "redstone-squid"
description = "A bot designed to manage redstone records"
version = "1.5.7"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# GitHub Actions keeps requirements/base.txt and requirements/dev.txt in sync.
# To reproduce the export locally, run:
# 1. uv export --no-dev --no-emit-workspace -o requirements/base.txt
# 2. uv export --only-dev -o requirements/dev.txt
dependencies = [
    "alembic>=1.18.5",
    # Structured concurrency on the asyncio backend. Already arrives transitively via
    # starlette, httpx and openai; declared here because we import it directly.
    "anyio>=4.14,<5",
    "babel>=2.17.0",
    "discord-py[speed]>=2.6.0,<3",
    "gspread>=6.1.4",
    "jishaku>=2.6.0",
    "fastapi>=0.115.6",
    "httpx>=0.28,<1",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.14,<3",
    "pgvector>=0.5,<1",
    "openai>=1.58.1",
    "async-lru>=2.0.4",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.3",
    "boto3>=1.43.48,<2",
    "cryptography>=50,<51",
    "beartype>=0.19.0",
    "rapidfuzz>=3.13.0",
    "squid-layouts[discord]",
    "sqlalchemy[postgresql-asyncpg,postgresql-psycopg2binary]>=2.0.41",
    "uvloop>=0.21.0 ; sys_platform != 'win32'",
    "advanced-alchemy>=1.11.0",
    "alembic-utils>=0.8.8",
    "whenever>=0.10.3",
    "python-json-logger>=3.2",
    "redis>=8,<9",
]

[project.optional-dependencies]
# The native Minecraft schematic engine. Kept optional because it ships no musl or
# linux-aarch64 wheels and its sdist needs a Rust toolchain, so a hard dependency would break
# those deployments outright. The bot degrades to schematic-free behavior without it.
#
# Pinned exactly, not ranged: fingerprints and data-version loss reports are version-scoped
# outputs we persist, so upgrading is a deliberate act that requires a backfill plan.
schematics = ["nucleation==0.10.14"]
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
    "opentelemetry-sdk>=1.44,<2",
]

[project.urls]
"Source Code" = "https://github.com/redstone-squid/Redstone-Squid"
"Issue Tracker" = "https://github.com/redstone-squid/Redstone-Squid/issues"

[dependency-groups]
# Note: GitHub Actions regenerates requirements/dev.txt when this group changes.
# Local reproduction: uv export --only-dev -o requirements/dev.txt
dev = [
    "docker>=7.2,<8",
    "hypothesis>=6.0.0",
    # Validates the published scene schema against real payloads in
    # squid-layouts' tests. Arrived transitively via schemathesis before; a
    # cross-language contract should not depend on another tool's dependency tree.
    "jsonschema>=4.23",
    "pip-tools>=7.4.1",
    "pytest-archon>=0.0.6",
    "ruff>=0.5.1",
    "bump-my-version>=0.29.0",
    "pyrefly>=1.2.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "testcontainers>=4.10.0",
    "prek>=0.2.28",
    "schemathesis==4.24.2",
    # Stub-only packages: docker, psycopg2 and markdown ship no type information, so without
    # these every symbol they export is `Any` and pyrefly reports `untyped-import`.
    "types-docker>=7.1",
    "types-Markdown>=3.7",
    "types-psycopg2>=2.9",
    # Matches the 'schematics' extra so CI (x86_64 Linux) always exercises the real adapter
    # rather than only the fakes.
    #
    # Upstream publishes exactly three wheels: manylinux x86_64, macOS arm64, Windows amd64.
    # The marker must therefore gate on OS as well as machine -- an Intel Mac reports
    # `x86_64` but has no wheel, and a machine-only marker sends it to the sdist, which needs
    # a Rust toolchain and fails `uv sync` outright. PEP 508 has no libc marker, so musl
    # cannot be excluded the same way; Alpine contributors must skip this group by hand.
    "nucleation==0.10.14 ; (platform_machine == 'x86_64' and sys_platform != 'darwin') or (platform_machine == 'arm64' and sys_platform == 'darwin')",
]
fuzz = [
    "atheris>=3.0.0; sys_platform == 'linux'",
]
# Documentation tooling is installed only when building or publishing the site.
docs = [
    "mkdocstrings-python>=1.18,<2",
    "zensical>=0.0.47,<0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
squid-layouts = { workspace = true }

[tool.uv]
package = false
# Only used for termux, don't enable universally.
# cache-dir = ".cache/uv"
# link-mode = "copy"
exclude-newer = "7 days"
# maturin cannot infer Termux's minimum SDK from its Python platform metadata. These packages
# build from source on Android, where Termux's current toolchain targets API 24.
# nucleation releases faster than the 7-day soak window (0.3.0 -> 0.9.2 inside two weeks), so
# the global cutoff would pin us to a version several API generations behind the one this
# integration targets. Carved out deliberately: the dependency is pinned exactly and its
# wheel hashes are locked, and it is an optional extra that no default deployment installs.
exclude-newer-package = { nucleation = "2026-08-16T00:00:00Z" }

[tool.uv.extra-build-variables]
# cryptography and jsonschema-rs are PyO3 extension modules. pyo3-ffi's build script already
# detects Android correctly and emits `cargo:rustc-link-lib=python3` -- pyo3-build-config
# special-cases target.environment == Android specifically because it knows the glibc trick
# (resolving CPython C-API symbols from the already-running process without an explicit NEEDED
# entry) doesn't work on bionic. Same failure mode as nucleation's Python3_SABI_LIBRARY bug
# (see docs/plans/completed/nucleation-android-build.md), different cause: the modules fail to import
# with "dlopen failed: cannot locate symbol PyLong_Type" (jsonschema-rs: _Py_TrueStruct).
#
# `-lpython3` genuinely reaches the final linker invocation -- confirmed by capturing the
# actual argv cargo invokes the linker with, via `maturin build -vv` run directly against the
# same source tree uv builds from. But Termux's default clang/lld toolchain links with
# --as-needed active, and nothing earlier on that argv (dozens of .rlib archives, then
# `-lssl -lcrypto -ldl -llog -lunwind -ldl -lm -lc`, then `-nodefaultlibs`) leaves an
# unresolved symbol at the point `-lpython3` is processed, so the linker silently drops it
# from DT_NEEDED even though PyLong_Type et al. are genuinely referenced elsewhere in the
# same object code. RUSTFLAGS and CARGO_ENCODED_RUSTFLAGS were both tried first (simpler, no
# wrapper script needed) and both still produced an unlinked .so -- consistent with the same
# elision landing on whichever position the flag ends up in, not a maturin/cargo propagation
# bug as such.
#
# scripts/android-link-with-libpython3.sh sidesteps the guesswork about argv position: it
# wraps `cc` and re-asserts `-lpython3` (Termux's unversioned, version-independent stable-ABI
# shim) wrapped in --no-as-needed/--as-needed on every real link invocation, which --as-needed
# cannot drop. Intermediate rlib compiles never invoke a linker at all, so it's a no-op there.
# Assumes this repo is checked out at /data/data/com.termux/files/home/Redstone-Squid, matching
# the same assumption already baked into nucleation's CMAKE_ARGS entry below.
cryptography = { ANDROID_API_LEVEL = "24", CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "/data/data/com.termux/files/home/Redstone-Squid/scripts/android-link-with-libpython3.sh" }
hypothesis = { ANDROID_API_LEVEL = "24" }
jiter = { ANDROID_API_LEVEL = "24" }
jsonschema-rs = { ANDROID_API_LEVEL = "24", CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "/data/data/com.termux/files/home/Redstone-Squid/scripts/android-link-with-libpython3.sh" }
orjson = { ANDROID_API_LEVEL = "24" }
pydantic-core = { ANDROID_API_LEVEL = "24" }
prek = { ANDROID_API_LEVEL = "24" }
# Three upstream build bugs block the sdist on Termux/Android; see
# docs/plans/completed/nucleation-android-build.md for full repro details. Each can be dropped once a
# fixed release lands:
#
# 1. https://github.com/Schem-at/Nucleation/issues/38 -- The wheel's default feature set is
#    "bridge-full", which pulls in rquickjs (scripting-js) for embedded JS scripting.
#    rquickjs-sys 0.9.0 ships pregenerated
#    bindgen output for a fixed target list that does not include aarch64-linux-android,
#    so the build fails outright even though nucleation_adapter.py never touches the
#    scripting bridge. The generated C++ bindings under src/sub_modules are NOT
#    conditionally generated per feature -- CMakeLists.txt globs all of them in
#    unconditionally -- so every *other* bridge-full feature must stay enabled or the
#    link fails looking for FFI symbols (e.g. IoLayout_destroy) the Rust side never
#    exported. scripting-js is the only feature that is both build-broken on Android and
#    safe to drop: bridge/scripting.rs's exported symbol is unconditional and only
#    branches internally on scripting-js/scripting-lua, so dropping just scripting-js
#    keeps the C++/Rust symbol contract intact.
# 2. https://github.com/Schem-at/Nucleation/issues/36 -- CMakeLists.txt links the compiled
#    extension against `${Python3_SABI_LIBRARY}`, but it calls `find_package(Python ...)`
#    (singular), which populates `Python_SABI_LIBRARY` -- the `Python3_`-prefixed variable
#    is never set, so the module links with no libpython dependency at all. glibc Linux
#    hides this: the main Python executable
#    already exports CPython's C-API symbols globally, so the extension resolves them at
#    load time regardless. Android's bionic linker does not do that implicit resolution,
#    so the resulting .so fails to import with "dlopen failed: cannot locate symbol
#    PyExc_ImportError". CMAKE_ARGS is scikit-build-core's documented passthrough for
#    extra `-D` args; supplying the variable under its real (buggy) name at the command
#    line forces cmake to pick it up even on an incremental reconfigure of the cached
#    build dir, where an env-seeded value would be ignored once already cached. The
#    unversioned libpython3.so is Termux's stable-ABI shim (not tied to a Python minor
#    version), matching what `Python_SABI_LIBRARY` would have resolved to.
# 3. https://github.com/Schem-at/Nucleation/issues/37 -- The `rendering` feature links wgpu,
#    whose Android GPU backend calls ANativeWindow_* (surface creation) from libandroid.so.
#    CMakeLists.txt links platform system libraries for WIN32 and APPLE but has no ANDROID
#    branch, so the link leaves those calls
#    unresolved; same glibc-hides-it/bionic-doesn't split as the SABI library above.
#    nanobind_add_module builds a CMake MODULE library (it's dlopen'd, never linked
#    against directly), so the flag belongs on CMAKE_MODULE_LINKER_FLAGS --
#    CMAKE_SHARED_LINKER_FLAGS silently does not apply to MODULE targets.
nucleation = { NUCLEATION_FEATURES = "bridge,meshing,simulation,rendering,scripting-lua,voxelize,world-segment,store-ssh,mc-tick,routing,hdl", CMAKE_ARGS = "-DPython3_SABI_LIBRARY=/data/data/com.termux/files/usr/lib/libpython3.so -DCMAKE_MODULE_LINKER_FLAGS=-landroid" }
# Pyrefly also enables LTO for releases; rustc's LLVM backend exceeds the memory available on
# Android while linking the binary built in place of the unavailable platform wheel.
pyrefly = { ANDROID_API_LEVEL = "24", CARGO_PROFILE_RELEASE_LTO = "off" }
rpds-py = { ANDROID_API_LEVEL = "24" }
# Ruff's release profile enables fat LTO, which can exhaust Android's linker during the final
# binary link. The PyPI wheels do not target Android, so keep the source build's optimizations
# but disable LTO to bound its peak memory use on Termux.
ruff = { ANDROID_API_LEVEL = "24", CARGO_PROFILE_RELEASE_LTO = "off" }

[tool.ruff]
line-length = 120
target-version = "py314"
# Spike prototypes under docs/plans/ are evidence for a design decision, written to
# mirror the shape they argue about rather than this project's standards. They are
# never imported by anything shipped, and pyrefly already excludes docs/ by omission.
extend-exclude = ["docs/plans/**/spikes/"]

[tool.ruff.lint]
select = [
    # Defaults
    "E4",
    "E7",
    "E9",
    "F",
    # Extended
    "B",
    "I",
    "TID251",
    "UP",
    "RUF",
    "TRY",
#    "D",
    "W293",  # Other W rules are covered already
    "FBT",
    "DTZ",
    "EM",
    "PT",
    "INP",
    "RET",
    "SIM",
#    "N",
    "PERF",
    "G",
]
ignore = [
    "UP040",  # Type alias {name} uses {type_alias_method} instead of the type keyword
    "UP046",  # Generic class {name} uses Generic subclass instead of type parameters
    "UP047",  # Generic function {name} should use type parameters
    "E731",  # Lambda assignment
    "SIM108",  # Use ternary operator {contents} instead of if-else-block
    # This is too rigid
    "TRY003",  # Avoid specifying long messages outside the exception class
    "RUF009",
    "RUF012",  # TODO
    "FBT001",
    "FBT002",
]

[tool.ruff.lint.isort]
# The workspace member's src layout is outside ruff's first-party detection at the repo root.
known-first-party = ["squid_layouts"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files.
"__init__.py" = ["E402"]
"env.py" = ["E402"]

"alembic/**.py" = ["INP"]
"alembic/versions/*.py" = ["D"]
"scripts/**.py" = ["INP"]

# INP: unlike tests/, these directories must stay namespace-less -- a second top-level
# `tests` package would collide with the repo's during a combined pytest run.
"packages/*/tests/**.py" = [
    "F841",
    "TID251",
    "EM",
    "RUF059",
    "D101",
    "D102",
    "D103",
    "INP"
]

"!tests/**.py" = ["PT"]
"tests/**.py" = [
    "F841",
    "TID251",
    "EM",
    "RUF059",
    "D101",
    "D102",
    "D103"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.bumpversion]
current_version = "1.5.7"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = true
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""
files.glob = "**/config.py,pyproject.toml"

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "standard"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "scripts/migrations"]

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
deprecateTypingAliases = true
reportPropertyTypeMismatch = "error"
reportUntypedFunctionDecorator = "information"
reportUntypedClassDecorator = "information"
reportUntypedBaseClass = "information"
reportUntypedNamedTuple = "information"
reportPrivateUsage = "warning"
reportConstantRedefinition = "information"
reportDeprecated = "information"
reportInconsistentConstructor = "warning"
reportUnknownVariableType = "information"
reportMissingParameterType = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportImplicitOverride = "error"
reportAny = false

enableExperimentalFeatures = true  # For `TypeForm` support

[tool.pyrefly]
project-includes = ["squid/**/*.py", "tests/**/*.py", "packages/**/*.py", "app.py"]
project-excludes = ["alembic/**/*.py", "scripts/migrations/**/*.py"]
python-version = "3.14"
# `observability` is an optional extra (see the dependency group below) that isn't installed in
# every environment; these imports are already guarded by `try`/`ModuleNotFoundError` at runtime.
ignore-missing-imports = ["opentelemetry", "opentelemetry.*"]

[tool.alembic]
script_location = "%(here)s/alembic"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
timezone = "utc"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests/unit",
    "tests/architecture",
    "packages/squid-layouts/tests",
]
xfail_strict = true
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",                 # short summary of skips/xfails
    "--cov=squid",
    "--cov=squid_layouts",
]
# https://docs.pytest.org/en/stable/how-to/capture-warnings.html#controlling-warnings
# When a warning matches more than one option in the list, the action for the last matching option is performed.
filterwarnings = [
    # Implicitly coerce all non-fatal warnings into fatal exceptions.
    "error",
    # Allow DeprecationWarnings to surface once per location without failing the suite, excluding the ones
    # explicitly ignored below
    "once::DeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "docker: requires a local Unix-socket Docker daemon",
  "external: opt-in tests that require live third-party services",
  "schematic: requires the optional native schematic engine",
  "render: requires the schematic engine plus a resource pack and a working GPU adapter",
]
