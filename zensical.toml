[project]
site_name = "Redstone Squid"
site_url = "https://redstone-squid.github.io/Redstone-Squid/"
site_description = "A Discord bot for managing Minecraft redstone build submissions."
repo_url = "https://github.com/redstone-squid/Redstone-Squid"
repo_name = "redstone-squid/Redstone-Squid"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"


# Navigation: the framework docs and bot guides. Pages not listed here (docs/plans,
# docs/decisions, translated READMEs) still build and remain searchable and linkable,
# but stay out of the reader-facing tree.
[[project.nav]]
Home = "index.md"

[[project.nav]]
"Squid UI" = [
    { Overview = "squid-ui.md" },
    { Quickstart = "squid-ui-quickstart.md" },
    { "Slack compile" = "squid-ui-slack-quickstart.md" },
    { "API map" = "squid-ui-api.md" },
    { Architecture = "squid-ui-architecture.md" },
    { Vocabulary = "squid-vocabulary.md" },
]

[[project.nav]]
Bot = [
    { "Screen conventions" = "bot-screens.md" },
    { Internationalization = "i18n.md" },
    { Notifications = "notifications.md" },
    { "Edits and history" = "edits.md" },
    { "Error reports" = "error-reports.md" },
    { "Action ledger" = "action-ledger.md" },
    { "Credential hashing" = "credential-hashing.md" },
    { "Media normalization" = "media-normalization.md" },
    { "Running with Docker" = "docker.md" },
    { "Adding a build attribute" = "new-build-attribute.md" },
    { "Writing a migration" = "new-migration.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
