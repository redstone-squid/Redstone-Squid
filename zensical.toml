[project]
site_name = "Redstone Squid"
site_url = "https://redstone-squid.github.io/Redstone-Squid/"
site_description = "A Discord bot for managing Minecraft redstone build submissions."
repo_url = "https://github.com/redstone-squid/Redstone-Squid"
repo_name = "redstone-squid/Redstone-Squid"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"


# Navigation: the framework docs and bot guides. Pages not listed here (docs/plans,
# docs/decisions, translated READMEs) still build and remain searchable and linkable,
# but stay out of the reader-facing tree.
[[project.nav]]
Home = "index.md"

[[project.nav]]
"Squid UI" = [
    { Overview = "squid-ui.md" },
    { Quickstart = "squid-ui-quickstart.md" },
    { "API map" = "squid-ui-api.md" },
    { Architecture = "squid-ui-architecture.md" },
    { Vocabulary = "squid-vocabulary.md" },
    { Reference = [
        { "squid-ui" = "reference/squid-ui.md" },
        { "squid-ui-widgets" = "reference/squid-ui-widgets.md" },
        { "squid-ui-discord" = "reference/squid-ui-discord.md" },
        { "squid-reactivity" = "reference/squid-reactivity.md" },
        { "squid-storage" = "reference/squid-storage.md" },
        { "squid-replication" = "reference/squid-replication.md" },
    ] },
]

[[project.nav]]
Bot = [
    { Internationalization = "i18n.md" },
    { Notifications = "notifications.md" },
    { "Error reports" = "error-reports.md" },
    { "Action ledger" = "action-ledger.md" },
    { "Credential hashing" = "credential-hashing.md" },
    { "Media normalization" = "media-normalization.md" },
    { "Adding a build attribute" = "new-build-attribute.md" },
    { "Writing a migration" = "new-migration.md" },
    { "Plan 68 migration" = "plan68-migration.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
heading_level = 3
merge_init_into_class = true
separate_signature = true
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
signature_crossrefs = true
