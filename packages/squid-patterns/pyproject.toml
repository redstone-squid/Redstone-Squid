[project]
name = "squid-patterns"
version = "0.1.0"
description = "Frontend-neutral, reusable application patterns for squid-layouts"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dependencies = ["squid-layouts"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
# uv's default cache key for a path dependency is the mtime of pyproject.toml plus the module
# root directory -- neither of which changes when a module is added under src/squid_patterns/.
# Docker builds with a persistent uv cache mount would otherwise reinstall a stale wheel.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
