[project]
name = "squid-layouts"
version = "0.1.0"
description = "Declarative, limits-aware Discord Components V2 UI framework"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "discord-py>=2.7,<3",
    "anyio>=4.14,<5",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
