[project]
name = "squid-ui"
version = "0.1.0a1"
description = "Declarative, limits-aware UI planning with a portable HTML renderer"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Redstone Squid contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["squid-reactivity==0.1.0a1"]

[project.urls]
Documentation = "https://redstone-squid.github.io/Redstone-Squid/squid-ui/"
Issues = "https://github.com/redstone-squid/Redstone-Squid/issues"
Repository = "https://github.com/redstone-squid/Redstone-Squid"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
# uv's default cache key for a path dependency is the mtime of pyproject.toml plus the module
# root directory -- neither of which changes when a module is added under src/squid_ui/.
# Docker builds with a persistent uv cache mount therefore reinstalled the skeleton wheel long
# after the package grew. Key on the sources themselves instead.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
