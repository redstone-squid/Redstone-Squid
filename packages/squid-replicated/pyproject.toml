[project]
name = "squid-replicated"
version = "0.1.0"
description = "Optional replicated-state adapters for Squid"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["squid-reactive"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
