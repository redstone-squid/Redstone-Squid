[project]
name = "squid-storage"
version = "0.1.0a1"
description = "Portable backing stores for Squid applications"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Redstone Squid contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["squid-reactivity==0.1.0a1", "anyio>=4.14,<5"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.31,<1"]

[project.urls]
Changelog = "https://github.com/redstone-squid/Redstone-Squid/blob/master/CHANGELOG.md"
Documentation = "https://redstone-squid.github.io/Redstone-Squid/squid-ui/"
Issues = "https://github.com/redstone-squid/Redstone-Squid/issues"
Repository = "https://github.com/redstone-squid/Redstone-Squid"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
