x-app-environment: &app-environment
  SQUID_STRICT_UNKNOWN_KEYS: ${SQUID_STRICT_UNKNOWN_KEYS:-true}
  SQUID_OBSERVABILITY_ENABLED: ${SQUID_OBSERVABILITY_ENABLED:-false}
  SQUID_OBSERVABILITY_ENDPOINT: ${SQUID_OBSERVABILITY_ENDPOINT:-http://otel-collector:4318}
  SQUID_OBSERVABILITY_ENVIRONMENT: ${SQUID_OBSERVABILITY_ENVIRONMENT:-production}
  SQUID_STORAGE_LOCAL_DIRECTORY: ${SQUID_STORAGE_LOCAL_DIRECTORY:-/var/lib/app/objects}

x-app: &app
  build:
    context: .
    target: runtime-base
    args:
      WITH_OBSERVABILITY: ${WITH_OBSERVABILITY:-1}
  restart: unless-stopped
  env_file:
    - ${SQUID_ENV_FILE:-.env}
  environment: *app-environment
  volumes:
    - squid-logs:/var/log/app
    - squid-objects:/var/lib/app/objects
  depends_on:
    db:
      condition: service_healthy
  stop_grace_period: 20s

services:
  api:
    <<: *app
    container_name: redstone-squid-api
    command: ["python", "-m", "squid.api.app"]
    environment:
      <<: *app-environment
      SQUID_RATE_LIMIT_REDIS_URL: ${SQUID_RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}
    ports:
      # SQUID_API_PORT is the app's own listen port, so it drives the container side; the
      # published side is separate because a taken host port must be movable on its own.
      - "${SQUID_API_HOST_PORT:-8000}:${SQUID_API_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${SQUID_API_PORT:-8000}/readyz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bot:
    <<: *app
    container_name: redstone-squid-bot
    command: ["python", "-m", "squid.bot.app"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    container_name: redstone-squid-worker
    build:
      context: .
      target: runtime-video
      args:
        WITH_OBSERVABILITY: ${WITH_OBSERVABILITY:-1}
        WITH_SCHEMATICS: ${WITH_SCHEMATICS:-1}
    command: ["python", "-m", "squid.worker.app"]
    environment:
      <<: *app-environment
      SQUID_MEDIA_FFMPEG: /usr/bin/ffmpeg
      SQUID_MEDIA_FFPROBE: /usr/bin/ffprobe
      SQUID_MEDIA_WORKING_DIRECTORY: /var/lib/app/media-tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-redstone_squid}
    ports:
      # Loopback-only so IntelliJ's database tools can attach without exposing Postgres.
      - "127.0.0.1:${SQUID_DB_PORT:-5432}:5432"
    volumes:
      # PG18 keeps its cluster under /var/lib/postgresql/18/docker, so the whole
      # /var/lib/postgresql tree is the volume — not the pre-18 .../data path.
      - squid-pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # SIGTERM is a smart shutdown that waits out open sessions; SIGINT ends them promptly.
    stop_signal: SIGINT
    stop_grace_period: 30s

  pgweb:
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-redstone_squid}?sslmode=disable
    ports:
      - "127.0.0.1:${SQUID_PGWEB_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 10s

  redis:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    restart: unless-stopped
    stop_grace_period: 20s
    profiles:
      - observability
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - squid-logs:/var/log/app:ro

volumes:
  squid-objects:
  squid-pgdata:
  squid-logs:
