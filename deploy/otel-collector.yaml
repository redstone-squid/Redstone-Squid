receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include:
      - /var/log/app/*.log
      - /var/log/app/**/*.log
    start_at: end
    include_file_name: true
    include_file_path: true
    operators:
      - type: json_parser
      - type: move
        if: 'body.service_name != nil'
        from: body.service_name
        to: resource["service.name"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  resource/logs:
    attributes:
      - key: service.name
        value: redstone-squid
        action: insert
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, resource/logs, batch]
      exporters: [debug]
