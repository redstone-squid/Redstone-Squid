services:
  api:
    image: ${SQUID_APP_IMAGE:?SQUID_APP_IMAGE must be an immutable image digest}
    pull_policy: always
    # Release migrations run explicitly before cutover, including on hosts that
    # also select compose.override.yml for ordinary development commands.
    depends_on: !override
      db:
        condition: service_healthy

  bot:
    image: ${SQUID_APP_IMAGE:?SQUID_APP_IMAGE must be an immutable image digest}
    pull_policy: always
    depends_on: !override
      db:
        condition: service_healthy

  worker:
    image: ${SQUID_WORKER_IMAGE:?SQUID_WORKER_IMAGE must be an immutable image digest}
    pull_policy: always
    depends_on: !override
      db:
        condition: service_healthy

  migrate:
    image: ${SQUID_APP_IMAGE:?SQUID_APP_IMAGE must be an immutable image digest}
    pull_policy: always
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles:
      - migration
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${SQUID_ENV_FILE:-.env}
    environment:
      SQUID_STRICT_UNKNOWN_KEYS: ${SQUID_STRICT_UNKNOWN_KEYS:-true}
      SQUID_STORAGE_LOCAL_DIRECTORY: ${SQUID_STORAGE_LOCAL_DIRECTORY:-/var/lib/app/objects}
    volumes:
      - squid-objects:/var/lib/app/objects
